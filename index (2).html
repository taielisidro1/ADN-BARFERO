<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADN Barfero — Panel de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js';"></script>
<style>
  :root{
    --ink:#241D20; --cream:#FCF3F7; --pink:#FF8FC4; --pink-dark:#D9509B;
    --pink-soft:#F4DCE8; --sand:#F7E4EF; --line:#F0D6E5; --slate:#8A7686;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:"Nunito",system-ui,sans-serif; }
  h1,h2,h3{ font-family:"Quicksand",sans-serif; color:var(--pink-dark); margin:0; }
  .topbar{
    background:var(--pink); color:#fff; padding:18px 26px; display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
    border-radius:0 0 22px 22px;
  }
  .topbar-left{ display:flex; align-items:center; gap:12px; }
  .logo-img{ height:46px; width:46px; border-radius:12px; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  .topbar h1{ color:#fff; font-size:21px; }
  .topbar .tag{ font-size:12px; color:#FBE9D8; }
  nav{ display:flex; gap:6px; padding:16px 16px 0; overflow-x:auto; max-width:980px; margin:0 auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  nav::-webkit-scrollbar{ display:none; }
  nav button{
    background:#fff; border:1px solid var(--line); color:var(--slate); padding:10px 18px;
    font-size:13.5px; cursor:pointer; font-family:"Quicksand",sans-serif; font-weight:600;
    border-radius:999px; white-space:nowrap;
  }
  nav button.active{ background:var(--pink); color:#fff; border-color:var(--pink); }
  nav button:hover:not(.active){ background:var(--sand); }
  main{ max-width:980px; margin:0 auto; padding:22px 20px 60px; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:22px; padding:22px 24px;
    margin-bottom:18px; box-shadow:0 2px 10px rgba(166,95,53,0.06);
  }
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi-card{ text-align:center; }
  .kpi-label{ font-size:13px; color:var(--slate); display:flex; justify-content:center; align-items:center; gap:6px; font-weight:600; }
  .kpi-value{ font-family:"Quicksand",sans-serif; font-size:32px; font-weight:700; color:var(--pink-dark); margin-top:6px; }
  .kpi-value.small{ font-size:20px; }
  .eye-btn{ background:none; border:none; cursor:pointer; font-size:16px; color:var(--slate); padding:0; }
  .note{ font-size:12.5px; color:var(--slate); margin:0 0 12px; }
  label{ font-size:13px; font-weight:700; color:var(--pink-dark); display:block; margin-bottom:5px; font-family:"Quicksand",sans-serif; }
  input, select{
    font-family:"Nunito",sans-serif; font-size:16px; padding:12px 14px; border-radius:14px;
    border:1.5px solid var(--line); background:#FFFDF9; color:var(--ink); width:100%;
    min-height:46px;
  }
  input:focus, select:focus, button:focus{ outline:2px solid var(--pink-dark); outline-offset:1px; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:14px; }
  .btn{
    background:var(--pink-dark); color:#fff; border:none; border-radius:999px; padding:12px 26px;
    font-size:14.5px; font-weight:700; cursor:pointer; font-family:"Quicksand",sans-serif;
  }
  .btn:hover{ background:#4B6D47; }
  .cliente-info{
    background:var(--sand); border:1px solid var(--line); border-radius:14px; padding:10px 16px;
    font-size:13.5px; margin-bottom:14px; display:none;
  }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{ text-align:left; color:var(--slate); font-size:11.5px; padding:8px 10px; font-weight:700; border-bottom:2px solid var(--sand); }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td{ border-bottom:none; }
  .caja-chip{ font-size:11px; padding:3px 10px; border-radius:999px; font-weight:700; }
  .caja-chica{ background:#F1E2C8; color:var(--pink-dark); }
  .caja-grande{ background:var(--pink); color:#fff; }
  .caja-ninguna{ color:var(--slate); }
  .empty{ color:var(--slate); font-size:13.5px; padding:24px 0; text-align:center; }
  .soon{ text-align:center; padding:60px 20px; color:var(--slate); }
  .soon h2{ margin-bottom:8px; }
  .soon .paw-big{ font-size:38px; margin-bottom:10px; }
  .badge{ display:inline-block; background:var(--pink); color:#fff; font-size:10.5px; padding:2px 8px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .chart-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  .chart-header select{ width:auto; padding:7px 12px; }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ min-width:520px; }

  .fila-venta{ cursor:pointer; }
  .fila-venta:hover{ background:var(--sand); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(36,29,32,0.45); z-index:50;
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-box{
    background:#fff; border-radius:22px; padding:22px 24px; max-width:460px; width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .btn-text{
    background:none; border:none; color:var(--slate); font-family:"Quicksand",sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; padding:10px 6px;
  }
  .btn-danger{ color:#C94F4F; }
  .btn-danger:hover{ text-decoration:underline; }
  .sync-badge{
    background:rgba(36,29,32,0.28); color:#fff; border:none; border-radius:999px; padding:8px 14px;
    font-size:12.5px; font-weight:700; font-family:"Quicksand",sans-serif; cursor:pointer; white-space:nowrap;
  }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; }
  .nav-arrow{
    background:#fff; border:1.5px solid var(--line); color:var(--pink-dark); border-radius:999px;
    width:36px; height:36px; font-size:14px; cursor:pointer;
  }
  .nav-arrow:hover{ background:var(--sand); }

  @media (max-width: 600px){
    .topbar{ padding:14px 16px; border-radius:0 0 18px 18px; }
    .topbar h1{ font-size:18px; }
    .logo-img{ height:38px; width:38px; }
    main{ padding:16px 12px 50px; }
    .card{ padding:16px 16px; border-radius:18px; }
    .kpi-value{ font-size:26px; }
    nav button{ padding:9px 14px; font-size:13px; }
    .btn{ width:100%; padding:13px 20px; }
    .form-grid{ grid-template-columns:1fr; }
  }
</style>
</head>

function costoNetoInsumo(id){
  const ins = INSUMOS.find(i => i.id === id);
  if (!ins) return 0;
  if (ins.tipo === "normal") return ins.bruto / (1 - (ins.merma||0));
  if (ins.tipo === "caja") return ins.bruto / (1 - (ins.merma||0)) / ins.boxKg;
  if (ins.tipo === "caja_kg") return ins.bruto / ins.boxKg;
  if (ins.tipo === "caja_raw") return ins.bruto;
  if (ins.tipo === "promedio_cajas") return ins.refs.reduce((a,r)=>a+costoNetoInsumo(r),0) / ins.refs.length;
  if (ins.tipo === "caja_promedio") return ins.refs.reduce((a,r)=>a+costoNetoInsumo(r),0) / ins.prorrateoKg;
  return 0;
}
function totalFijosSinMO(){ return COSTOS_FIJOS.items.reduce((a,i)=>a+i.monto,0); }
function costoVariableUnitario(prdId){
  const receta = RECETAS[prdId] || {};
  return Object.entries(receta).reduce((a,[insId,qty]) => a + costoNetoInsumo(insId)*qty, 0);
}
function costoFijoUnitario(prdId){
  const meta = PRODUCTOS_META[prdId];
  if (!meta || !meta.demanda) return 0;
  return (meta.prorrFact*totalFijosSinMO() + COSTOS_FIJOS.manoDeObra*meta.prorrKg) / meta.demanda;
}
function costoTotalUnitario(prdId){ return costoVariableUnitario(prdId) + costoFijoUnitario(prdId); }

function genLoteId(){ return "lote-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6); }

function stockDisponible(producto){
  return STOCK.filter(l => l.producto === producto).reduce((a,l) => a + l.kilosRestantes, 0);
}
// Descuenta kg del/los lote(s) más viejos con stock > 0. Devuelve qué lotes tocó (para poder
// restaurarlos si la venta se edita o se borra) y cuánto no pudo descontar por falta de stock.
function consumirStock(producto, kg){
  const consumos = [];
  let restante = kg;
  const lotes = STOCK.filter(l => l.producto === producto && l.kilosRestantes > 0)
    .sort((a,b) => a.fechaElaboracion < b.fechaElaboracion ? -1 : a.fechaElaboracion > b.fechaElaboracion ? 1 : 0);
  for (const lote of lotes){
    if (restante <= 0) break;
    const tomar = Math.min(lote.kilosRestantes, restante);
    lote.kilosRestantes -= tomar;
    restante -= tomar;
    consumos.push({ loteId: lote.id, kilos: tomar });
  }
  saveStock(STOCK);
  return { consumos, faltante: Math.max(0, restante) };
}
function restaurarStock(consumos){
  if (!consumos || !consumos.length) return;
  consumos.forEach(c => {
    const lote = STOCK.find(l => l.id === c.loteId);
    if (lote) lote.kilosRestantes += c.kilos;
  });
  saveStock(STOCK);
}

// ---------------- SINCRONIZACIÓN CON GOOGLE SHEETS ----------------
// La app sigue guardando todo en este dispositivo (rápido y anda sin internet). Además, cada cambio
// se sube al Sheet, y al abrir o volver a la app se baja lo último del Sheet.
const SYNC_KEYS = ["abf_ventas","abf_stock","abf_clientes","abf_insumos","abf_recetas","abf_costos_fijos","abf_productos_precios"];
let syncCfg = loadJSON("abf_sync_cfg", null);                 // { url, token } — queda solo en este dispositivo
const syncSucias = new Set(loadJSON("abf_sync_sucias", []));   // claves con cambios locales todavía no subidos
let syncEstado = (syncCfg && syncCfg.url && syncCfg.token) ? "ok" : "off";   // off | ok | guardando | error
let syncEnCurso = false, syncTimer = null, syncUltimoPull = 0, syncUltimoError = "", syncListeners = false;

function syncConfigurado(){ return !!(syncCfg && syncCfg.url && syncCfg.token); }
function persistirSucias(){ try{ localStorage.setItem("abf_sync_sucias", JSON.stringify([...syncSucias])); }catch(e){} }
function pintarSyncBadge(el){
  const t = { off:"☁️ Conectar a Sheets", ok:"🟢 Sincronizado", guardando:"🟡 Guardando…", error:"🔴 Sin conexión" };
  el.textContent = t[syncEstado] || t.off;
  el.title = syncEstado === "error"
    ? "No se pudo sincronizar (" + syncUltimoError + "). Tus cambios siguen guardados en este dispositivo y se suben solos cuando vuelva la conexión."
    : "Conexión con Google Sheets";
}
function setSyncEstado(s){
  syncEstado = s;
  const el = document.getElementById("syncBadge");
  if (el) pintarSyncBadge(el);
}
function syncMensajeError(e){
  const m = String((e && e.message) || e);
  if (m === "no_autorizado") return "la clave no coincide con la del script";
  if (m === "token_sin_configurar") return "falta cambiar TOKEN en el script";
  if (/abort/i.test(m)) return "el Sheet tardó demasiado en responder";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "sin internet o URL incorrecta";
  return m;
}
function marcarSucio(key){
  if (!syncConfigurado()) return;
  syncSucias.add(key); persistirSucias();
  setSyncEstado("guardando");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncEmpujar, 800);
}
async function syncLlamar(payload, cfg){
  const c = cfg || syncCfg;
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 30000);
  try {
    // text/plain evita el preflight de CORS, que Apps Script no soporta
    const r = await fetch(c.url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ token:c.token, ...payload }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "error");
    return j;
  } finally { clearTimeout(to); }
}
function syncManejarFallo(fallo){
  syncUltimoError = syncMensajeError(fallo);
  setSyncEstado("error");
  // con clave mal puesta reintentar no sirve; con falta de conexión sí
  if (!/no_autorizado|token_sin_configurar/.test(String(fallo && fallo.message))){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncCicloCompleto, 20000);
  }
}
async function syncEmpujar(){
  if (!syncConfigurado()) return;
  if (syncEnCurso){ clearTimeout(syncTimer); syncTimer = setTimeout(syncEmpujar, 1500); return; }
  if (syncSucias.size === 0){ if (syncEstado !== "error") setSyncEstado("ok"); return; }
  syncEnCurso = true;
  let fallo = null;
  try {
    for (const key of [...syncSucias]){
      const snap = localStorage.getItem(key);
      if (snap === null){ syncSucias.delete(key); continue; }
      await syncLlamar({ action:"set", key, value: JSON.parse(snap) });
      if (localStorage.getItem(key) === snap) syncSucias.delete(key);   // si cambió mientras subía, sigue pendiente
      persistirSucias();
    }
  } catch(e){ fallo = e; }
  syncEnCurso = false;
  if (fallo){ syncManejarFallo(fallo); return; }
  if (syncSucias.size){ setSyncEstado("guardando"); clearTimeout(syncTimer); syncTimer = setTimeout(syncEmpujar, 800); }
  else setSyncEstado("ok");
}
function recargarEstado(){
  INSUMOS = loadInsumos(); RECETAS = loadRecetas(); COSTOS_FIJOS = loadCostosFijos(); STOCK = loadStock();
  loadProductos().forEach(f => { const p = PRODUCTOS.find(x => x.id === f.id); if (p) p.precio = f.precio; });
}
function refrescarVistaSiSePuede(){
  const a = document.activeElement;
  const editando = !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName || "");
  const ov = document.getElementById("modalOverlay");
  if (editando || (ov && ov.style.display === "flex")) return;   // no pisar lo que está tipeando
  if (activeTab === "ventas") renderTablaVentas(); else renderMain();
}
async function syncTraer(){
  if (!syncConfigurado() || syncEnCurso) return;
  syncEnCurso = true;
  let cambio = false, fallo = null;
  try {
    const j = await syncLlamar({ action:"getAll" });
    const remoto = j.data || {};
    for (const key of SYNC_KEYS){
      if (syncSucias.has(key)) continue;                 // cambios locales sin subir: gana lo local
      const rv = remoto[key];
      if (rv === undefined){                             // el Sheet todavía no tiene esto: lo subimos
        if (localStorage.getItem(key) !== null) syncSucias.add(key);
        continue;
      }
      if ((key === "abf_ventas" || key === "abf_stock") && !Array.isArray(rv)) continue;
      const nuevo = JSON.stringify(rv);
      if (localStorage.getItem(key) !== nuevo){ localStorage.setItem(key, nuevo); cambio = true; }
    }
    persistirSucias();
    syncUltimoPull = Date.now();
  } catch(e){ fallo = e; }
  syncEnCurso = false;
  if (fallo){ syncManejarFallo(fallo); return; }
  if (cambio){ recargarEstado(); refrescarVistaSiSePuede(); }
  setSyncEstado(syncSucias.size ? "guardando" : "ok");
}
async function syncCicloCompleto(){
  if (!syncConfigurado()) return;
  await syncTraer();
  await syncEmpujar();
}
function registrarListenersSync(){
  if (syncListeners) return;
  syncListeners = true;
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - syncUltimoPull > 15000) syncCicloCompleto();
  });
  window.addEventListener("online", () => syncCicloCompleto());
  setInterval(() => { if (document.visibilityState === "visible") syncCicloCompleto(); }, 120000);
}
function iniciarSync(){
  const badge = document.getElementById("syncBadge");
  if (badge){ badge.addEventListener("click", abrirSyncModal); pintarSyncBadge(badge); }
  if (!syncConfigurado()) return;
  registrarListenersSync();
  syncCicloCompleto();
}
function cerrarSyncModal(){ const ov = document.getElementById("syncOverlay"); if (ov) ov.style.display = "none"; }
function abrirSyncModal(){
  const ov = document.getElementById("syncOverlay"), box = document.getElementById("syncBox");
  if (!ov || !box) return;
  const conectado = syncConfigurado();
  box.innerHTML = `
    <h3 style="font-size:16px; margin-bottom:6px;">☁️ Conexión con Google Sheets</h3>
    <p class="note">Pegá la URL de la implementación de Apps Script (termina en /exec) y la clave que pusiste en TOKEN. Se guarda solo en este dispositivo.</p>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div><label for="syncUrl">URL</label><input type="text" id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></div>
      <div><label for="syncToken">Clave</label><input type="password" id="syncToken" autocomplete="off"></div>
    </div>
    <p class="note" id="syncMsg"></p>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      ${conectado ? '<button class="btn-text btn-danger" id="syncDesconectar">Desconectar</button>' : '<span></span>'}
      <div style="display:flex; gap:10px;">
        <button class="btn-text" id="syncCerrar">Cerrar</button>
        <button class="btn" id="syncGuardar">Probar y guardar</button>
      </div>
    </div>`;
  const msg = document.getElementById("syncMsg");
  if (conectado){
    document.getElementById("syncUrl").value = syncCfg.url;
    document.getElementById("syncToken").value = syncCfg.token;
    msg.textContent = syncEstado === "error" ? "Último error: " + syncUltimoError + "." : "Conectado.";
  }
  ov.style.display = "flex";
  document.getElementById("syncCerrar").addEventListener("click", cerrarSyncModal);
  if (conectado){
    document.getElementById("syncDesconectar").addEventListener("click", () => {
      syncCfg = null;
      try{ localStorage.removeItem("abf_sync_cfg"); }catch(e){}
      syncSucias.clear(); persistirSucias();
      clearTimeout(syncTimer);
      setSyncEstado("off");
      cerrarSyncModal();
    });
  }
  document.getElementById("syncGuardar").addEventListener("click", async () => {
    const url = document.getElementById("syncUrl").value.trim();
    const token = document.getElementById("syncToken").value.trim();
    // la clave solo se manda a Google, nunca a otro dominio
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ msg.textContent = "La URL tiene que empezar con https://script.google.com/ y terminar en /exec."; return; }
    if (!token){ msg.textContent = "Falta la clave."; return; }
    msg.textContent = "Probando la conexión…";
    const cfg = { url, token };
    try {
      await syncLlamar({ action:"ping" }, cfg);
      const j = await syncLlamar({ action:"getAll" }, cfg);
      const remoto = j.data || {};
      const choca = ["abf_ventas","abf_stock"].some(k => {
        const loc = loadJSON(k, []);
        return remoto[k] !== undefined && loc.length > 0 && JSON.stringify(remoto[k]) !== JSON.stringify(loc);
      });
      if (choca && !confirm("El Sheet ya tiene datos distintos a los de este dispositivo. Si seguís, los datos de este dispositivo se reemplazan por los del Sheet. ¿Continuar?")){
        msg.textContent = "No se conectó."; return;
      }
    } catch(e){ msg.textContent = "No pude conectar: " + syncMensajeError(e) + "."; return; }
    syncCfg = cfg;
    saveJSON("abf_sync_cfg", cfg);
    registrarListenersSync();
    cerrarSyncModal();
    setSyncEstado("guardando");
    syncCicloCompleto();
  });
}

  main.innerHTML = `<div class="card soon"><div class="paw-big">🐾</div><h2>${tab.label.replace(/^\S+\s/,"")}</h2><p>${tab.desc}</p><p style="font-size:12.5px;">Ya lo vamos a sumar acá mismo.</p></div>`;
}

// ---------------- DASHBOARD ----------------
let dashChart = null;
function renderDashboard(main){
  const ventas = loadVentas();
  const mes = dashMes;
  const delMes = ventas.filter(v => monthOf(v.fecha) === mes);
  const kgMes = delMes.reduce((a,v)=>a+v.kilos,0);
  const factMes = delMes.reduce((a,v)=>a+v.total,0);
  const cajasChicas = delMes.filter(v=>v.caja==="chica").length;
  const cajasGrandes = delMes.filter(v=>v.caja==="grande").length;

  const opciones = `<option value="TODOS">Todos los productos</option>` +
    PRODUCTOS.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join("");

  main.innerHTML = `
    <div class="month-nav">
      <button id="mesPrev" class="nav-arrow" title="Mes anterior">◀</button>
      <h3 style="font-size:16px;">📅 ${monthFull(mes)}</h3>
      <button id="mesNext" class="nav-arrow" title="Mes siguiente">▶</button>
    </div>
    <div class="kpi-row">
      <div class="card kpi-card">
        <div class="kpi-label">🥩 Kg vendidos</div>
        <div class="kpi-value">${fmtKg(kgMes)}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Facturación
          <button class="eye-btn" id="eyeBtn" title="Mostrar/ocultar">${hideRevenue?"🙈":"👁"}</button>
        </div>
        <div class="kpi-value">${hideRevenue ? "••••••" : fmtMoney(factMes)}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">📦 Cajas usadas</div>
        <div class="kpi-value small">${cajasChicas} chicas · ${cajasGrandes} grandes</div>
      </div>
    </div>
    <div class="card">
      <div class="chart-header">
        <h3 style="font-size:16px;">Cómo van las ventas</h3>
        <select id="selProducto">${opciones}</select>
      </div>
      <p class="note">Kilos vendidos por día — el número de arriba ya te dice el total, este gráfico solo acompaña</p>
      <canvas id="chartMes" height="210"></canvas>
      <p class="empty" id="chartEmptyMsg" style="display:none;">🐾 No hay ventas cargadas en ${monthFull(mes)}.</p>
    </div>
  `;

  document.getElementById("eyeBtn").addEventListener("click", () => {
    hideRevenue = !hideRevenue; saveJSON("abf_hide_revenue", hideRevenue); renderDashboard(main);
  });
  document.getElementById("mesPrev").addEventListener("click", () => { dashMes = shiftMonth(dashMes,-1); renderDashboard(main); });
  document.getElementById("mesNext").addEventListener("click", () => { dashMes = shiftMonth(dashMes,1); renderDashboard(main); });
  const selProducto = document.getElementById("selProducto");
  selProducto.value = dashProducto;
  selProducto.addEventListener("change", () => { dashProducto = selProducto.value; drawChart(); });

  function drawChart(){
    let filtradas = ventas.filter(v => monthOf(v.fecha) === mes);
    let label = "Todos los productos";
    if (dashProducto !== "TODOS"){
      const p = PRODUCTOS.find(x=>x.id===dashProducto);
      filtradas = filtradas.filter(v => v.producto === p.nombre);
      label = p.nombre;
    }
    const porDia = {};
    filtradas.forEach(v => { const d=v.fecha; porDia[d]=(porDia[d]||0)+v.kilos; });
    const dias = Object.keys(porDia).sort(); // solo los días que ya tienen ventas cargadas
    const labels = dias.map(d => parseInt(d.slice(8,10),10) + " " + monthLabel(mes).split(" ")[0]);
    const data = dias.map(d => Math.round((porDia[d]||0)*10)/10);

    const canvasEl = document.getElementById("chartMes");
    const emptyMsg = document.getElementById("chartEmptyMsg");
    if (dias.length === 0){
      canvasEl.style.display = "none"; emptyMsg.style.display = "block";
      if (dashChart) dashChart.destroy();
      return;
    }
    canvasEl.style.display = "block"; emptyMsg.style.display = "none";

    if (dashChart) dashChart.destroy();
    if (typeof Chart === "undefined") return;
    dashChart = new Chart(document.getElementById("chartMes"), {
      type:"line",
      data:{ labels, datasets:[{
        label, data, borderColor:TERRACOTA, backgroundColor:"rgba(201,124,75,0.15)",
        borderWidth:3, tension:0.4, fill:true, pointRadius:5, pointBackgroundColor:TERRACOTA,
        pointBorderColor:"#fff", pointBorderWidth:2,
      }]},
      options:{
        responsive:true,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=>fmtKg(ctx.parsed.y) } } },
        scales:{
          x:{ grid:{display:false}, ticks:{color:INK, font:{size:13,family:"Nunito",weight:"600"}} },
          y:{ grid:{color:SAND}, border:{display:false}, ticks:{color:"#B8A88C", font:{size:11}, maxTicksLimit:4} },
        },
      },
    });
  }
  drawChart();
}

// ---------------- REGISTRO DE VENTAS ----------------
function genId(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }

function statsCliente(nombre){
  const key = (nombre||"").trim().toLowerCase();
  if (!key) return null;
  const propias = loadVentas().filter(v => (v.cliente||"").trim().toLowerCase() === key);
  if (propias.length === 0) return null;
  const puntos = Math.round(propias.reduce((a,v)=>a+v.kilos,0));
  return { compras: propias.length, puntos };
}

let filtroTexto = "";
let filtroProducto = "TODOS";
let filtroDesde = "";
let filtroHasta = "";

function renderVentas(main){
  const opciones = PRODUCTOS.map(p => `<option value="${p.id}">${p.nombre} — ${fmtMoney(p.precio)}/kg</option>`).join("");
  const cajaOpciones = Object.entries(CAJAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  const filtroOpciones = `<option value="TODOS">Todos los productos</option>` + PRODUCTOS.map(p=>`<option value="${p.nombre}">${p.nombre}</option>`).join("");

  main.innerHTML = `
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:14px;">🐾 Registrar una venta</h3>
      <div class="form-grid">
        <div>
          <label for="inpFecha">Fecha</label>
          <input type="date" id="inpFecha" value="${todayStr()}">
        </div>
        <div>
          <label for="inpProducto">Tipo de vianda</label>
          <select id="inpProducto">${opciones}</select>
        </div>
        <div>
          <label for="inpKilos">Kilos</label>
          <input type="number" id="inpKilos" min="0.1" step="0.1" placeholder="Ej: 5">
        </div>
        <div>
          <label for="inpCaja">¿Lleva caja?</label>
          <select id="inpCaja">${cajaOpciones}</select>
        </div>
        <div>
          <label for="inpCliente">Cliente (nombre o DNI)</label>
          <input type="text" id="inpCliente" placeholder="Opcional">
        </div>
      </div>
      <div class="cliente-info" id="clienteInfo"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div id="totalPreview" style="font-size:14px; color:var(--slate); font-weight:600;"></div>
        <button class="btn" id="btnRegistrar">Registrar venta 🐾</button>
      </div>
    </div>
    <div class="card">
      <div class="chart-header">
        <h3 style="font-size:16px;">Últimas ventas</h3>
      </div>
      <div class="form-grid" style="margin-bottom:10px;">
        <input type="text" id="inpBuscar" placeholder="Buscar por cliente...">
        <select id="selFiltroProducto">${filtroOpciones}</select>
        <input type="date" id="inpFiltroDesde" title="Desde">
        <input type="date" id="inpFiltroHasta" title="Hasta">
      </div>
      <p class="note" id="ventasHint"></p>
      <div id="tablaVentas"></div>
    </div>
    <div id="modalOverlay" class="modal-overlay" style="display:none;">
      <div class="modal-box" id="modalBox"></div>
    </div>
  `;

  const inpProducto=document.getElementById("inpProducto"), inpKilos=document.getElementById("inpKilos");
  const inpCaja=document.getElementById("inpCaja"), inpCliente=document.getElementById("inpCliente");
  const totalPreview=document.getElementById("totalPreview"), clienteInfo=document.getElementById("clienteInfo");
  const inpBuscar=document.getElementById("inpBuscar"), selFiltroProducto=document.getElementById("selFiltroProducto");

  function updatePreview(){
    const prod = PRODUCTOS.find(p => p.id === inpProducto.value);
    const kg = parseFloat(inpKilos.value) || 0;
    const disp = stockDisponible(prod.nombre);
    let txt = kg > 0 ? "Total: " + fmtMoney(prod.precio*kg) + "  ·  " + fmtMoney(prod.precio) + "/kg  ·  " : "";
    txt += "Stock disponible: " + fmtKg(disp);
    if (kg > disp) txt += " ⚠️ no alcanza";
    totalPreview.textContent = txt;
  }
  function checkCliente(){
    const s = statsCliente(inpCliente.value);
    if (s){
      clienteInfo.style.display = "block";
      clienteInfo.textContent = "🐾 Cliente reconocido — compra n.º " + (s.compras+1) + ", " + s.puntos + " puntos acumulados.";
    } else { clienteInfo.style.display = "none"; }
  }
  inpProducto.addEventListener("change", updatePreview);
  inpKilos.addEventListener("input", () => { inpCaja.value = sugerirCaja(parseFloat(inpKilos.value)); updatePreview(); });
  inpCliente.addEventListener("input", checkCliente);
  updatePreview();

  document.getElementById("btnRegistrar").addEventListener("click", () => {
    const kg = parseFloat(inpKilos.value);
    if (!kg || kg <= 0){ inpKilos.focus(); return; }
    const prod = PRODUCTOS.find(p => p.id === inpProducto.value);
    const fecha = document.getElementById("inpFecha").value || todayStr();
    const total = prod.precio * kg;

    const { consumos, faltante } = consumirStock(prod.nombre, kg);
    const ventas = loadVentas();
    const hora = new Date().toTimeString().slice(0,5);
    ventas.unshift({ id:genId(), fecha, hora, producto:prod.nombre, kilos:kg, precio:prod.precio, total, caja:inpCaja.value, cliente: inpCliente.value.trim()||null, consumos });
    saveVentas(ventas);
    if (faltante > 0.001){
      alert("Ojo: no había stock suficiente cargado de " + prod.nombre + ". Faltaron " + fmtKg(faltante) + " sin descontar de ningún lote — la venta se registró igual.");
    }

    inpKilos.value=""; inpCliente.value=""; inpCaja.value="ninguna";
    updatePreview(); checkCliente(); renderTablaVentas();
  });

  inpBuscar.addEventListener("input", () => { filtroTexto = inpBuscar.value; renderTablaVentas(); });
  selFiltroProducto.addEventListener("change", () => { filtroProducto = selFiltroProducto.value; renderTablaVentas(); });
  document.getElementById("inpFiltroDesde").value = filtroDesde;
  document.getElementById("inpFiltroHasta").value = filtroHasta;
  document.getElementById("inpFiltroDesde").addEventListener("change", (e) => { filtroDesde = e.target.value; renderTablaVentas(); });
  document.getElementById("inpFiltroHasta").addEventListener("change", (e) => { filtroHasta = e.target.value; renderTablaVentas(); });

  renderTablaVentas();
}

function ventasFiltradas(){
  const todas = loadVentas();
  const texto = filtroTexto.trim().toLowerCase();
  return todas.filter(v => {
    if (filtroProducto !== "TODOS" && v.producto !== filtroProducto) return false;
    if (texto && !((v.cliente||"").toLowerCase().includes(texto))) return false;
    if (filtroDesde && v.fecha < filtroDesde) return false;
    if (filtroHasta && v.fecha > filtroHasta) return false;
    return true;
  });
}

function renderTablaVentas(){
  const el = document.getElementById("tablaVentas");
  const hint = document.getElementById("ventasHint");
  if (!el) return;
  const hayFiltro = filtroTexto.trim() !== "" || filtroProducto !== "TODOS" || filtroDesde !== "" || filtroHasta !== "";
  const todas = ventasFiltradas();
  const ventas = hayFiltro ? todas : todas.slice(0,15);
  if (hint) hint.textContent = hayFiltro
    ? (ventas.length + " resultado" + (ventas.length===1?"":"s") + " — hacé click en una venta para ver el detalle")
    : "Mostrando las últimas 15 — hacé click en una venta para editarla o borrarla";

  if (ventas.length === 0){ el.innerHTML = '<div class="empty">🐾 No encontré ventas con ese filtro.</div>'; return; }
  const cajaChip = (c) => c==="chica" ? '<span class="caja-chip caja-chica">Caja chica</span>'
                        : c==="grande" ? '<span class="caja-chip caja-grande">Caja grande</span>'
                        : '<span class="caja-chip caja-ninguna">—</span>';
  const rows = ventas.map(v => `
    <tr data-id="${v.id}" class="fila-venta">
      <td>${v.fecha}</td>
      <td>${v.producto}</td>
      <td>${fmtKg(v.kilos)}</td>
      <td>${cajaChip(v.caja)}</td>
      <td>${fmtMoney(v.total)}</td>
      <td>${v.cliente || "—"}</td>
    </tr>`).join("");
  el.innerHTML = `<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Kilos</th><th>Caja</th><th>Total</th><th>Cliente</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  el.querySelectorAll(".fila-venta").forEach(tr => {
    tr.addEventListener("click", () => openVentaModal(tr.getAttribute("data-id")));
  });
}

// ---------------- MODAL: detalle / editar / borrar venta ----------------
function closeModal(){
  const ov = document.getElementById("modalOverlay");
  if (ov) ov.style.display = "none";
}
function openVentaModal(id){
  const ventas = loadVentas();
  const venta = ventas.find(v => v.id === id);
  if (!venta) return;
  const box = document.getElementById("modalBox");
  const opciones = PRODUCTOS.map(p => `<option value="${p.id}" ${p.nombre===venta.producto?"selected":""}>${p.nombre}</option>`).join("");
  const cajaOpciones = Object.entries(CAJAS).map(([k,v])=>`<option value="${k}" ${k===venta.caja?"selected":""}>${v}</option>`).join("");
  box.innerHTML = `
    <h3 style="font-size:16px; margin-bottom:14px;">Detalle de la venta</h3>
    <div class="form-grid">
      <div><label>Fecha</label><input type="date" id="mFecha" value="${venta.fecha}"></div>
      <div><label>Hora</label><input type="time" id="mHora" value="${venta.hora||""}"></div>
      <div><label>Tipo de vianda</label><select id="mProducto">${opciones}</select></div>
      <div><label>Kilos</label><input type="number" id="mKilos" min="0.1" step="0.1" value="${venta.kilos}"></div>
      <div><label>¿Lleva caja?</label><select id="mCaja">${cajaOpciones}</select></div>
      <div><label>Cliente</label><input type="text" id="mCliente" value="${venta.cliente||""}"></div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:4px;">
      <button class="btn-text btn-danger" id="mBorrar">Eliminar venta</button>
      <div style="display:flex; gap:10px;">
        <button class="btn-text" id="mCancelar">Cancelar</button>
        <button class="btn" id="mGuardar">Guardar cambios</button>
      </div>
    </div>
  `;
  document.getElementById("modalOverlay").style.display = "flex";

  document.getElementById("mCancelar").addEventListener("click", closeModal);
  document.getElementById("mGuardar").addEventListener("click", () => {
    const prod = PRODUCTOS.find(p => p.id === document.getElementById("mProducto").value);
    const kg = parseFloat(document.getElementById("mKilos").value) || venta.kilos;
    const fecha = document.getElementById("mFecha").value || venta.fecha;
    const caja = document.getElementById("mCaja").value;
    const cliente = document.getElementById("mCliente").value.trim() || null;
    const hora = document.getElementById("mHora").value || venta.hora;

    restaurarStock(venta.consumos);
    const { consumos, faltante } = consumirStock(prod.nombre, kg);
    const actualizada = { ...venta, fecha, hora, producto:prod.nombre, kilos:kg, precio:prod.precio, total:prod.precio*kg, caja, cliente, consumos };
    const nuevas = loadVentas().map(v => v.id === id ? actualizada : v);
    saveVentas(nuevas);
    if (faltante > 0.001){
      alert("Ojo: no había stock suficiente cargado de " + prod.nombre + " para esta cantidad. Faltaron " + fmtKg(faltante) + ".");
    }
    closeModal();
    renderTablaVentas();
  });
  document.getElementById("mBorrar").addEventListener("click", () => {
    if (!confirm("¿Seguro que querés eliminar esta venta? No se puede deshacer.")) return;
    restaurarStock(venta.consumos);
    const nuevas = loadVentas().filter(v => v.id !== id);
    saveVentas(nuevas);
    closeModal();
    renderTablaVentas();
  });
}

function renderPrecios(main){

    <div class="card">
      <h3 style="font-size:16px; margin-bottom:6px;">💰 Costos fijos mensuales</h3>
      <p class="note">Estos gastos se reparten entre los productos según cuánto facturan y cuántos kilos representan cada uno. Si los cambiás, se recalcula todo solo.</p>

      <div style="margin-top:10px; font-family:'Quicksand',sans-serif; font-weight:700; color:var(--pink-dark); font-size:14.5px;">
        Total costos fijos (sin mano de obra): <span id="totalFijosSinMO"></span>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:16px; margin-bottom:6px;">🥩 Insumos</h3>
      <p class="note">Editá el costo de compra y la merma de cada insumo — el costo neto por kg se recalcula solo. Verdura y Caja promedio se calculan a partir de los cajones/cajas de abajo.</p>
      <div class="table-scroll"><table id="tablaInsumos" style="min-width:560px;"></table></div>

    <div class="card">

      <p class="note">El precio actual es el que ya tenés cargado — editalo cuando quieras. Para ver la receta de cada vianda y simular otro margen, hacé click en "Receta y margen".</p>

function renderTablaFijos(){
  const el = document.getElementById("tablaFijos");

  const rows = COSTOS_FIJOS.items.map((it,idx) => `
    <tr>
      <td>${it.nombre}</td>
      <td><input type="number" class="fijo-monto" data-idx="${idx}" value="${it.monto}" min="0" step="100" style="min-height:38px; padding:6px 10px;"></td>
    </tr>`).join("");
  el.innerHTML = `
    <thead><tr><th>Gasto</th><th>Monto mensual</th></tr></thead>
    <tbody>${rows}
      <tr>
        <td>Mano de obra</td>
        <td><input type="number" id="inpManoDeObra" value="${COSTOS_FIJOS.manoDeObra}" min="0" step="100" style="min-height:38px; padding:6px 10px;"></td>
      </tr>
    </tbody>`;
  el.querySelectorAll(".fijo-monto").forEach(inp => {
    inp.addEventListener("input", () => {
      COSTOS_FIJOS.items[parseInt(inp.dataset.idx,10)].monto = parseFloat(inp.value)||0;
      saveCostosFijos(COSTOS_FIJOS);
      document.getElementById("totalFijosSinMO").textContent = fmtMoney(totalFijosSinMO());
      renderTablaPrecios();
    });
  });
  document.getElementById("inpManoDeObra").addEventListener("input", (e) => {
    COSTOS_FIJOS.manoDeObra = parseFloat(e.target.value)||0;
    saveCostosFijos(COSTOS_FIJOS);
    renderTablaPrecios();
  });
  document.getElementById("totalFijosSinMO").textContent = fmtMoney(totalFijosSinMO());
}

function renderTablaInsumos(){
  const el = document.getElementById("tablaInsumos");
  if (!el) return;
  const rows = INSUMOS.map(ins => {
    const neto = costoNetoInsumo(ins.id);
    if (ins.tipo === "promedio_cajas" || ins.tipo === "caja_promedio"){
      const fuente = ins.refs.map(id => INSUMOS.find(i=>i.id===id).nombre).join(" + ");
      return `<tr>
        <td>${ins.nombre}</td>
        <td colspan="2" style="color:var(--slate); font-size:12.5px;">📊 calculado: ${fuente}</td>
        <td style="font-weight:700;">${fmtMoney(neto)}/kg</td>
      </tr>`;
    }
    const tieneMerma = (ins.tipo === "normal" || ins.tipo === "caja");
    const mermaPct = Math.round((ins.merma||0)*1000)/10;
    return `<tr>
      <td>${ins.nombre}</td>
      <td><input type="number" class="insumo-bruto" data-id="${ins.id}" value="${ins.bruto}" min="0" step="1" style="min-height:38px; padding:6px 10px;"></td>
      <td>${tieneMerma ? `<input type="number" class="insumo-merma" data-id="${ins.id}" value="${mermaPct}" min="0" max="90" step="1" style="min-height:38px; padding:6px 10px; width:80px; display:inline-block;">%` : '<span style="color:var(--slate);">—</span>'}</td>
      <td style="font-weight:700;">${fmtMoney(neto)}/kg</td>
    </tr>`;
  }).join("");
  el.innerHTML = `<thead><tr><th>Insumo</th><th>Costo bruto</th><th>Merma</th><th>Costo neto</th></tr></thead><tbody>${rows}</tbody>`;
  el.querySelectorAll(".insumo-bruto").forEach(inp => {
    inp.addEventListener("input", () => {
      const ins = INSUMOS.find(i => i.id === inp.dataset.id);
      ins.bruto = parseFloat(inp.value)||0;
      saveInsumos(INSUMOS);
      renderTablaInsumos();
      renderTablaPrecios();
    });
  });
  el.querySelectorAll(".insumo-merma").forEach(inp => {
    inp.addEventListener("input", () => {
      const ins = INSUMOS.find(i => i.id === inp.dataset.id);
      ins.merma = (parseFloat(inp.value)||0)/100;
      saveInsumos(INSUMOS);
      renderTablaInsumos();
      renderTablaPrecios();
    });
  });
}

function renderTablaPrecios(){
  const el = document.getElementById("tablaPrecios");
  if (!el) return;
  const rows = PRODUCTOS.filter(p => PRODUCTOS_META[p.id]).map(p => {
    const ctotal = costoTotalUnitario(p.id);
    const margen = ctotal > 0 ? ((p.precio - ctotal)/ctotal*100) : 0;
    const color = margen < 15 ? "#C0392B" : margen < 30 ? "#B8860B" : "#2E7D46";
    return `<tr data-id="${p.id}">
      <td>${p.nombre}</td>
      <td>${fmtMoney(ctotal)}</td>
      <td><input type="number" class="precio-input" data-id="${p.id}" value="${p.precio}" min="0" step="50" style="min-height:38px; padding:6px 10px; width:110px;"></td>
      <td style="font-weight:700; color:${color};">${margen.toFixed(1)}%</td>
      <td><button class="btn-text detalle-btn" data-id="${p.id}">Receta y margen 🔍</button></td>
    </tr>`;
  }).join("");
  el.innerHTML = `<thead><tr><th>Producto</th><th>Costo total/kg</th><th>Precio actual</th><th>Margen actual</th><th></th></tr></thead><tbody>${rows}</tbody>`;
  el.querySelectorAll(".precio-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const p = PRODUCTOS.find(x => x.id === inp.dataset.id);
      const val = parseFloat(inp.value);
      if (!isNaN(val) && val >= 0){ p.precio = val; savePrecioProducto(p.id, p.precio); }
      renderTablaPrecios();
    });
  });
  el.querySelectorAll(".detalle-btn").forEach(btn => {
    btn.addEventListener("click", () => openProductoModal(btn.dataset.id));
  });
}

function openProductoModal(id){
  const p = PRODUCTOS.find(x => x.id === id);
  const receta = RECETAS[id] || (RECETAS[id] = {});
  const box = document.getElementById("modalBox");

  function render(){
    const cvar = costoVariableUnitario(id);
    const cfijo = costoFijoUnitario(id);
    const ctotal = cvar + cfijo;
    const margenActual = ctotal > 0 ? ((p.precio - ctotal)/ctotal*100) : 0;

    const filasReceta = Object.entries(receta).map(([insId,qty]) => {
      const ins = INSUMOS.find(i=>i.id===insId);
      if (!ins) return "";
      return `<tr>
        <td>${ins.nombre}</td>
        <td><input type="number" class="receta-qty" data-ins="${insId}" value="${qty}" min="0" step="0.01" style="min-height:36px; padding:5px 8px; width:80px;"></td>
        <td>${fmtMoney(costoNetoInsumo(insId))}/kg</td>
      </tr>`;
    }).join("");

    box.innerHTML = `
      <h3 style="font-size:16px; margin-bottom:4px;">${p.nombre}</h3>
      <p class="note" style="margin-bottom:12px;">Cantidad de cada insumo por kg de producto terminado.</p>
      <div class="table-scroll"><table><thead><tr><th>Insumo</th><th>Cant./kg</th><th>Costo neto</th></tr></thead><tbody>${filasReceta}</tbody></table></div>
      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.8;">
        <div>Costo variable/kg: <strong>${fmtMoney(cvar)}</strong></div>
        <div>Costo fijo/kg (prorrateado): <strong>${fmtMoney(cfijo)}</strong></div>
        <div>Costo total/kg: <strong>${fmtMoney(ctotal)}</strong></div>
        <div>Precio actual: <strong>${fmtMoney(p.precio)}</strong> — margen actual: <strong>${margenActual.toFixed(1)}%</strong></div>
      </div>
      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
        <label for="inpMargenDeseado">Simular con este margen sobre el costo</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <input type="number" id="inpMargenDeseado" value="${Math.max(0,Math.round(margenActual))}" min="0" step="1" style="width:90px;">
          <span>%</span>
        </div>
        <p class="note" id="simResultado" style="margin-top:10px; margin-bottom:10px;"></p>
        <button class="btn" id="btnUsarPrecio" style="display:none;"></button>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn-text" id="mCerrar">Cerrar</button>
      </div>
    `;

    box.querySelectorAll(".receta-qty").forEach(inp => {
      inp.addEventListener("input", () => {
        receta[inp.dataset.ins] = parseFloat(inp.value)||0;
        RECETAS[id] = receta;
        saveRecetas(RECETAS);
        render();
        renderTablaPrecios();
      });
    });
    document.getElementById("mCerrar").addEventListener("click", closeModal);

    const inpMargen = document.getElementById("inpMargenDeseado");
    const simResultado = document.getElementById("simResultado");
    const btnUsar = document.getElementById("btnUsarPrecio");
    function actualizarSim(){
      const deseado = parseFloat(inpMargen.value);
      if (isNaN(deseado)){ simResultado.textContent=""; btnUsar.style.display="none"; return; }
      const sugerido = Math.round(ctotal*(1+deseado/100));
      const diff = sugerido - p.precio;
      simResultado.innerHTML = `Precio sugerido: <strong>${fmtMoney(sugerido)}</strong> &nbsp;(${diff>=0?"+":""}${fmtMoney(diff)} vs. el actual)`;
      btnUsar.style.display = "inline-block";
      btnUsar.textContent = "Usar " + fmtMoney(sugerido) + " como nuevo precio";
      btnUsar.onclick = () => {
        p.precio = sugerido;
        savePrecioProducto(p.id, p.precio);
        render();
        renderTablaPrecios();
      };
    }
    inpMargen.addEventListener("input", actualizarSim);
    actualizarSim();
  }
  render();
  document.getElementById("modalOverlay").style.display = "flex";
}

// ---------------- STOCK Y PRODUCCIÓN ----------------
function renderStock(main){
  const opcionesProd = PRODUCTOS.map(p => `<option value="${p.id}">${p.nombre}</option>`).join("");
  main.innerHTML = `
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:6px;">📦 Cargar producción</h3>
      <p class="note">Cada lote queda identificado por su fecha de elaboración. Al registrar una venta, se descuenta primero del lote más viejo con stock (FIFO) — así nunca vendés algo recién hecho dejando algo más viejo guardado.</p>
      <div class="form-grid">
        <div>
          <label for="inpFechaElab">Fecha de elaboración</label>
          <input type="date" id="inpFechaElab" value="${todayStr()}">
        </div>
        <div>
          <label for="inpProdStock">Producto</label>
          <select id="inpProdStock">${opcionesProd}</select>
        </div>
        <div>
          <label for="inpKilosStock">Kilos producidos</label>
          <input type="number" id="inpKilosStock" min="0.1" step="0.1" placeholder="Ej: 20">
        </div>
      </div>
      <button class="btn" id="btnCargarStock">Agregar al stock 📦</button>
    </div>
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:6px;">Stock actual</h3>
      <p class="note">Ordenado del lote más viejo al más nuevo — el de arriba es el próximo que se descuenta al vender.</p>
      <div id="stockPorProducto"></div>
    </div>
  `;

  document.getElementById("btnCargarStock").addEventListener("click", () => {
    const fecha = document.getElementById("inpFechaElab").value || todayStr();
    const prod = PRODUCTOS.find(p => p.id === document.getElementById("inpProdStock").value);
    const inpKg = document.getElementById("inpKilosStock");
    const kg = parseFloat(inpKg.value);
    if (!kg || kg <= 0){ inpKg.focus(); return; }
    STOCK.push({ id:genLoteId(), producto:prod.nombre, fechaElaboracion:fecha, kilosIniciales:kg, kilosRestantes:kg });
    saveStock(STOCK);
    inpKg.value = "";
    renderStockTabla();
  });

  renderStockTabla();
}

function renderStockTabla(){
  const el = document.getElementById("stockPorProducto");
  if (!el) return;
  if (STOCK.length === 0){
    el.innerHTML = '<div class="empty">🐾 Todavía no cargaste ningún lote de producción.</div>';
    return;
  }
  const nombres = [...new Set(STOCK.map(l => l.producto))];

  const bloques = nombres.map(nombre => {
    const lotes = STOCK.filter(l => l.producto === nombre)
      .sort((a,b) => a.fechaElaboracion < b.fechaElaboracion ? -1 : a.fechaElaboracion > b.fechaElaboracion ? 1 : 0);
    const total = lotes.reduce((a,l) => a + l.kilosRestantes, 0);
    let yaMarcoProximo = false;
    const filas = lotes.map(l => {
      const esProximo = !yaMarcoProximo && l.kilosRestantes > 0;
      if (esProximo) yaMarcoProximo = true;
      return `<tr data-lote="${l.id}">
        <td>${l.fechaElaboracion}${esProximo ? ' <span class="badge">próximo</span>' : ""}</td>
        <td><input type="number" class="lote-kg" data-id="${l.id}" value="${l.kilosRestantes}" min="0" step="0.1" style="min-height:36px; padding:5px 8px; width:90px;"></td>
        <td style="color:var(--slate); font-size:12.5px;">de ${fmtKg(l.kilosIniciales)} iniciales</td>
        <td><button class="btn-text btn-danger borrar-lote" data-id="${l.id}">Eliminar</button></td>
      </tr>`;
    }).join("");
    return `
      <div style="margin-bottom:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <strong style="font-family:'Quicksand',sans-serif; color:var(--pink-dark);">${nombre}</strong>
          <span style="font-weight:700;">${fmtKg(total)} disponibles</span>
        </div>
        <div class="table-scroll"><table><thead><tr><th>Fecha de elaboración</th><th>Kilos restantes</th><th></th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
      </div>`;
  }).join("");
  el.innerHTML = bloques;

  el.querySelectorAll(".lote-kg").forEach(inp => {
    inp.addEventListener("change", () => {
      const lote = STOCK.find(l => l.id === inp.dataset.id);
      if (lote) lote.kilosRestantes = Math.max(0, parseFloat(inp.value)||0);
      saveStock(STOCK);
      renderStockTabla();
    });
  });
  el.querySelectorAll(".borrar-lote").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm("¿Eliminar este lote del stock? No se puede deshacer.")) return;
      STOCK = STOCK.filter(l => l.id !== btn.dataset.id);
      saveStock(STOCK);
      renderStockTabla();
    });
  });
}

// ---------------- CLIENTES ----------------
let filtroClientes = "";

function listaClientes(){
  const ventas = loadVentas().filter(v => v.cliente && v.cliente.trim());
  const map = {};
  ventas.forEach(v => {
    const key = v.cliente.trim().toLowerCase();
    if (!map[key]) map[key] = { nombre:v.cliente.trim(), compras:0, kilos:0, total:0, ultimaFecha:v.fecha, productos:{} };
    const c = map[key];
    c.compras += 1;
    c.kilos += v.kilos;
    c.total += v.total;
    if (v.fecha > c.ultimaFecha) c.ultimaFecha = v.fecha;
    c.productos[v.producto] = (c.productos[v.producto]||0) + v.kilos;
  });
  return Object.entries(map).map(([key,c]) => {
    let favorito = null, max = 0;
    Object.entries(c.productos).forEach(([p,kg]) => { if (kg > max){ max = kg; favorito = p; } });
    return { key, nombre:c.nombre, compras:c.compras, kilos:c.kilos, total:c.total, ultimaFecha:c.ultimaFecha, favorito };
  }).sort((a,b) => b.kilos - a.kilos);
}

function renderClientes(main){
  main.innerHTML = `
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:6px;">🐶 Clientes</h3>
      <p class="note">Se calculan solos a partir de las ventas registradas con nombre de cliente — puntos = kilos acumulados. Hacé click en uno para ver su historial completo y guardarle un teléfono o una nota.</p>

  `;
  document.getElementById("inpBuscarCliente").addEventListener("input", (e) => {

}

function openClienteModal(key){

      <div><label for="cTelefono">Teléfono</label><input type="text" id="cTelefono" value="${extra.telefono||""}" placeholder="Opcional"></div>

    <div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Kilos</th><th>Total</th></tr></thead><tbody>${filas}</tbody></table></div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
      <button class="btn-text" id="mCerrarCliente">Cerrar</button>

  document.getElementById("modalOverlay").style.display = "flex";
  document.getElementById("mCerrarCliente").addEventListener("click", closeModal);

    const d = loadClientes();
    d[key] = { telefono: document.getElementById("cTelefono").value.trim(), notas: document.getElementById("cNotas").value.trim() };
    saveClientes(d);
    closeModal();
  });
}

// ---------------- PRONÓSTICO ----------------
const DIAS_SEMANA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function diasConDatos(){
  const ventas = loadVentas();
  if (ventas.length === 0) return { desde:null, hasta:null, dias:0 };
  const fechas = ventas.map(v => v.fecha).sort();
  const desde = fechas[0], hasta = fechas[fechas.length-1];
  const dias = Math.max(1, Math.round((new Date(hasta+"T00:00:00") - new Date(desde+"T00:00:00"))/86400000) + 1);
  return { desde, hasta, dias };
}

// Promedio de kg/día vendidos de un producto, en los últimos "ventanaDias" días con datos
// (contando los días sin venta de ese producto como cero, para no inflar el promedio).
function promedioDiarioProducto(nombreProducto, ventanaDias){
  const todas = loadVentas();
  if (todas.length === 0) return 0;
  const fechas = todas.map(v => v.fecha).sort();
  let desde = fechas[0];
  const hasta = fechas[fechas.length-1];
  if (ventanaDias){
    const limite = new Date(hasta+"T00:00:00");
    limite.setDate(limite.getDate() - ventanaDias + 1);
    const limiteStr = limite.toISOString().slice(0,10);
    if (limiteStr > desde) desde = limiteStr;
  }
  const totalDias = Math.max(1, Math.round((new Date(hasta+"T00:00:00") - new Date(desde+"T00:00:00"))/86400000) + 1);
  const kgEnVentana = todas.filter(v => v.producto === nombreProducto && v.fecha >= desde && v.fecha <= hasta).reduce((a,v) => a+v.kilos, 0);
  return kgEnVentana / totalDias;
}

// Factor del día de la semana (1 = vende como un día promedio, 1.2 = vende 20% más ese día).
// Necesita al menos una semana completa de datos para no inventar un patrón con poca info.
function factorDiaSemana(nombreProducto, diaSemana){
  const todas = loadVentas();
  const fechasTodas = [...new Set(todas.map(v => v.fecha))].sort();
  if (fechasTodas.length < 7) return 1;
  const porFecha = {};
  todas.filter(v => v.producto === nombreProducto).forEach(v => { porFecha[v.fecha] = (porFecha[v.fecha]||0) + v.kilos; });
  const sumaPorDia = [0,0,0,0,0,0,0], countPorDia = [0,0,0,0,0,0,0];
  fechasTodas.forEach(f => {
    const d = new Date(f+"T00:00:00").getDay();
    sumaPorDia[d] += porFecha[f]||0;
    countPorDia[d] += 1;
  });
  const promedios = sumaPorDia.map((s,i) => countPorDia[i] ? s/countPorDia[i] : 0);
  const promedioGeneral = promedios.reduce((a,b)=>a+b,0)/7;
  if (promedioGeneral <= 0) return 1;
  return promedios[diaSemana] / promedioGeneral;
}

function renderPronostico(main){
  const { desde, hasta, dias } = diasConDatos();
  const manana = (() => { const d = new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  main.innerHTML = `
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:6px;">📈 Pronóstico de ventas</h3>
      <p class="note">${
        dias < 14
          ? "Todavía hay pocos días de ventas registradas" + (dias>0 ? " (" + dias + ")" : "") + ", así que esto es más un piso que una proyección precisa. Se va a afinar solo a medida que registrés más ventas."
          : "Calculado con " + dias + " días de historial (" + desde + " a " + hasta + "), promediando por producto y por día de la semana."
      }</p>
      <div class="form-grid" style="max-width:260px;">
        <div>
          <label for="inpFechaPron">¿Para qué fecha?</label>
          <input type="date" id="inpFechaPron" value="${manana}">
        </div>
      </div>
    </div>
    <div class="card">
      <p class="note">La "sugerencia a producir" es el pronóstico para ese día menos el stock que ya tenés cargado — si el stock alcanza, no hace falta producir más.</p>
      <div class="table-scroll"><table id="tablaPronostico" style="min-width:680px;"></table></div>
    </div>
  `;
  document.getElementById("inpFechaPron").addEventListener("change", renderTablaPronostico);
  renderTablaPronostico();
}

function renderTablaPronostico(){
  const el = document.getElementById("tablaPronostico");
  if (!el) return;
  const fecha = document.getElementById("inpFechaPron").value || todayStr();
  const diaSemana = new Date(fecha+"T00:00:00").getDay();
  const rows = PRODUCTOS.map(p => {
    const promedio = promedioDiarioProducto(p.nombre, 60);
    const factor = factorDiaSemana(p.nombre, diaSemana);
    const pronostico = promedio * factor;
    const disp = stockDisponible(p.nombre);
    const sugerido = Math.max(0, pronostico - disp);
    return `<tr>
      <td>${p.nombre}</td>
      <td>${fmtKg(promedio)}/día</td>
      <td>${pronostico > 0 ? fmtKg(pronostico) : "—"}</td>
      <td>${fmtKg(disp)}</td>
      <td style="font-weight:700; color:${sugerido > 0 ? 'var(--pink-dark)' : '#2E7D46'};">${sugerido > 0 ? fmtKg(sugerido) : "Alcanza con el stock"}</td>
    </tr>`;
  }).join("");
  el.innerHTML = `<thead><tr><th>Producto</th><th>Promedio diario</th><th>Pronóstico — ${DIAS_SEMANA[diaSemana]}</th><th>Stock disponible</th><th>Sugerencia a producir</th></tr></thead><tbody>${rows}</tbody>`;
}
